<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clean Home: four times of day</title>
<!-- The home screen at the four times of day, side by side. Add ?view=idle for the idle screen. -->
<style>
  html, body { margin: 0; background: #0A0A0B; color: #F5F5F7; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(2, 960px); gap: 28px 40px; padding: 32px 40px; width: max-content; }
  .cell span { display: block; font-size: 26px; font-weight: 600; margin: 0 0 10px 4px; }
  .cell small { font-weight: 400; color: #AEAEB2; margin-left: 10px; font-size: 22px; }
  iframe { width: 960px; height: 540px; border: 0; border-radius: 14px; display: block; background: #000; }
</style>
</head>
<body>
<div class="grid" id="g"></div>
<script>
const view = new URLSearchParams(location.search).get('view') || 'home';
const P = [['pagi', 'Morning', 'before 11:00'], ['siang', 'Midday', '11:00-14:59'], ['sore', 'Afternoon', '15:00-17:59'], ['malam', 'Night', 'from 18:00']];
document.getElementById('g').innerHTML = P.map(([p, n, h]) =>
  `<div class="cell"><span>${n}<small>${h}</small></span><iframe src="index.html?view=${view}&phase=${p}"></iframe></div>`).join('');
</script>
</body>
</html>
